/* =====================================================
   QUIZ VARIABLES
===================================================== */

let quizQuestions = [];
let currentQuestion = 0;
let userAnswers = [];
let score = 0;


/* =====================================================
   SHUFFLE FUNCTION
===================================================== */

function shuffle(array){

    let arr = [...array];

    for(let i = arr.length - 1; i > 0; i--){

        let j = Math.floor(Math.random() * (i + 1));

        [arr[i], arr[j]] = [arr[j], arr[i]];
    }

    return arr;
}


/* =====================================================
   START QUIZ
===================================================== */

function startQuiz(){

    /*
       Select 20 random questions
       from the 60-question bank
    */

    quizQuestions = shuffle(questionBank)
        .slice(0,20)
        .map(q => ({
            ...q,
            options: shuffle(q.options)
        }));

    currentQuestion = 0;
    userAnswers = new Array(20).fill(null);
    score = 0;

    document.getElementById("quizScreen")
        .classList.remove("hidden");

    document.getElementById("resultScreen")
        .classList.add("hidden");

    showQuestion();
}


/* =====================================================
   DISPLAY QUESTION
===================================================== */

function showQuestion(){

    const q = quizQuestions[currentQuestion];

    document.getElementById("progress").innerText =
        "Question " + (currentQuestion + 1) + " of 20";

    document.getElementById("question").innerText =
        q.question;

    const optionsContainer =
        document.getElementById("options");

    optionsContainer.innerHTML = "";

    q.options.forEach((option,index)=>{

        const label = document.createElement("label");

        label.className = "option";

        label.innerHTML = `
            <input
                type="radio"
                name="answer"
                value="${option}"
                ${userAnswers[currentQuestion] === option ? "checked" : ""}
            >
            ${option}
        `;

        label.addEventListener("click",function(){

            userAnswers[currentQuestion] = option;

            document
                .querySelectorAll(".option")
                .forEach(el => el.classList.remove("selected"));

            label.classList.add("selected");
        });

        if(userAnswers[currentQuestion] === option){
            label.classList.add("selected");
        }

        optionsContainer.appendChild(label);

    });


    /* Previous button */

    document.getElementById("prevBtn").style.visibility =
        currentQuestion === 0 ? "hidden" : "visible";


    /* Last question button */

    if(currentQuestion === 19){

        document.getElementById("nextBtn").innerText =
            "Submit Quiz ✓";

    }else{

        document.getElementById("nextBtn").innerText =
            "Next →";

    }

}


/* =====================================================
   NEXT QUESTION
===================================================== */

function nextQuestion(){

    if(!userAnswers[currentQuestion]){

        alert("Please select an answer before continuing.");

        return;
    }


    if(currentQuestion < 19){

        currentQuestion++;

        showQuestion();

    }else{

        finishQuiz();

    }

}


/* =====================================================
   PREVIOUS QUESTION
===================================================== */

function previousQuestion(){

    if(currentQuestion > 0){

        currentQuestion--;

        showQuestion();

    }

}


/* =====================================================
   FINISH QUIZ
===================================================== */

function finishQuiz(){

    score = 0;


    quizQuestions.forEach((q,index)=>{

        if(userAnswers[index] === q.answer){

            score++;

        }

    });


    const percentage =
        Math.round((score / 20) * 100);


    document.getElementById("quizScreen")
        .classList.add("hidden");

    document.getElementById("resultScreen")
        .classList.remove("hidden");


    document.getElementById("finalScore").innerText =
        score + " / 20";


    document.getElementById("percentage").innerText =
        percentage + "%";


    let message = "";


    if(percentage >= 90){

        message =
        "🌟 Outstanding! You have demonstrated excellent knowledge of finance.";

    }else if(percentage >= 75){

        message =
        "👏 Very good! You have a strong understanding of finance concepts.";

    }else if(percentage >= 60){

        message =
        "👍 Good effort! Keep practicing to strengthen your finance knowledge.";

    }else if(percentage >= 40){

        message =
        "📚 Good beginning. Review the concepts and try the quiz again.";

    }else{

        message =
        "💡 Keep learning and practicing. Every attempt is an opportunity to improve.";

    }


    document.getElementById("resultMessage").innerText =
        message;


    showReview();

}


/* =====================================================
   ANSWER REVIEW
===================================================== */

function showReview(){

    const container =
        document.getElementById("reviewContainer");

    container.innerHTML = "";


    quizQuestions.forEach((q,index)=>{

        const div =
            document.createElement("div");


        const isCorrect =
            userAnswers[index] === q.answer;


        div.className =
            "review-item " +
            (isCorrect ? "correct" : "wrong");


        div.innerHTML = `

            <strong>
                ${index + 1}. ${q.question}
            </strong>

            Your answer:
            ${userAnswers[index] || "Not answered"}

            <br>

            Correct answer:
            ${q.answer}

        `;


        container.appendChild(div);

    });

}


/* =====================================================
   RESTART
===================================================== */

function restartQuiz(){

    startQuiz();

}


/* =====================================================
